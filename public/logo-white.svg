<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180" fill="none">
  <!-- Left Signature Dual Pillars (||) -->
  <rect x="12" y="14" width="46" height="146" rx="23" fill="#20DE92"/>
  <rect x="78" y="14" width="46" height="146" rx="23" fill="#20DE92"/>

  <!-- VOX Wordmark (White for Dark Theme) -->
  <text 
    x="160" 
    y="136" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="148" 
    letter-spacing="-5"
