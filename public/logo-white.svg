  <!-- Underline -->
  <line 
    x1="172" 
    y1="168" 
    x2="385" 
    y2="168" 
    stroke="#20DE92" 
    stroke-width="5" 
    stroke-linecap="round"
  />

  <!-- OZET Subtitle -->
  <text 
    x="395" 
    y="178" 
    fill="#20DE92" 
    font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" 
    font-weight="900" 
