<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="voxAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20DE92" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="#000000"/>
  <circle cx="512" cy="512" r="480" fill="url(#voxAmbientGlow)"/>

  <!-- Main Logo Group (Centered) -->
  <g transform="translate(100, 360)">
    <!-- Dual Emerald Pillar Bars (||) -->
    <rect x="0" y="24" width="76" height="240" rx="38" fill="#20DE92"/>
    <rect x="110" y="24" width="76" height="240" rx="38" fill="#20DE92"/>

    <!-- VOX Wordmark -->
    <text 
      x="250" 
      y="230" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="252" 
      letter-spacing="-8"
    >VOX</text>

    <!-- Underline -->
    <line 
      x1="270" 
      y1="284" 
      x2="615" 
      y2="284" 
      stroke="#20DE92" 
      stroke-width="9" 
      stroke-linecap="round"
    />

    <!-- OZET Subtitle -->
    <text 
      x="630" 
      y="302" 
      fill="#20DE92" 
      font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" 
      font-weight="900" 
      font-size="70" 
      letter-spacing="1"
    >OZET</text>
  </g>
</svg>
