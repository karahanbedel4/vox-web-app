<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b24"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="logoEmeraldLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="logoEmeraldRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#logoBgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#logoBorderGrad)" stroke-width="14"/>

  <!-- Ambient Glow Center -->
  <circle cx="512" cy="512" r="280" fill="#10b981" opacity="0.18" filter="url(#logoGlow)"/>

  <!-- Dual Emerald Pillar Sound Bars (Signature VOX Icon) -->
  <!-- Left Pillar -->
  <rect x="344" y="248" width="136" height="528" rx="68" fill="url(#logoEmeraldLeft)"/>
  <!-- Right Pillar -->
  <rect x="544" y="248" width="136" height="528" rx="68" fill="url(#logoEmeraldRight)"/>
</svg>
